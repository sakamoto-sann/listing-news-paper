name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: python -m pip install -r requirements.txt
      - name: selftest
        run: python listing_news_paper.py --selftest
      - name: unittest
        run: python -m unittest discover -s tests -v
